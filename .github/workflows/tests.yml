# The full test suite, run on every pull request and on main after each merge: the Playwright tests in Chromium
# and Firefox, and the MySQL and MariaDB checks (`npm run test:mysql`). Locally, `npm test` runs just Chromium
# against SQLite, and `npm run test:full` runs the same tests as this workflow, with the browsers in Docker.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run still going for its older commit.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (Chromium and Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The PHP that tests/e2e/Dockerfile installs (Ubuntu 24.04's), found as `php` on the PATH (tests/e2e/php.ts).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # The browsers are cached per Playwright version; their system libraries come from apt every run.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox

      - run: npx playwright test

      # Traces and screenshots of failed tests (playwright.config.ts keeps them only on failure).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  mysql:
    name: MySQL and MariaDB checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Needs only Docker and Node's own modules, so no npm ci.
      - run: npm run test:mysql
